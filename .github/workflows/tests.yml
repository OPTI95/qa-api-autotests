name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Ежедневный прогон: ловим деградацию стенда, а не только свои изменения
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "Набор тестов"
        required: false
        default: "regression"
        type: choice
        options: [smoke, regression]

env:
  BASE_URL: https://petstore.swagger.io/v2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Прогнать тесты
        run: pytest -m "${{ github.event.inputs.marker || 'smoke or regression' }}"

      - name: Сохранить результаты Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ALLURE_VERSION: "2.32.0"
    steps:
      - name: Забрать результаты прогона
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Забрать историю прошлых отчётов
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Перенести историю в результаты
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history allure-results/history
          fi

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Allure CLI
        run: |
          curl -sSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Собрать отчёт
        run: allure generate allure-results --clean -o allure-report

      - name: Опубликовать на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
