name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Ежедневный прогон: ловим деградацию стенда, а не только свои изменения
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      marker:
        description: "Набор тестов"
        required: false
        default: "regression"
        type: choice
        options: [smoke, regression]

env:
  BASE_URL: https://petstore.swagger.io/v2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Прогнать тесты
        run: pytest -m "${{ github.event.inputs.marker || 'smoke or regression' }}"

      - name: Сохранить результаты Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          retention-days: 14

  report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Забрать результаты
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Загрузить историю прошлых прогонов
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Собрать отчёт Allure
        uses: simple-elf/allure-report-action@v1.7
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Опубликовать на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
